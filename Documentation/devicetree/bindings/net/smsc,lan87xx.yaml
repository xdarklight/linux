%YAML 1.2
---
$id: http://devicetree.org/schemas/net/smsc,lan87xx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SMSC / Microchip LAN87xx PHY

maintainers:
  - Andrew Lunn <andrew@lunn.ch>
  - Florian Fainelli <f.fainelli@gmail.com>

description:
  Bindings for SMSC / Microchip LAN87xx PHYs

properties:
  compatible:
    enum:
      - ethernet-phy-id0007.c0a0 # LAN83C185
      - ethernet-phy-id0007.c0b0 # LAN8187
      - ethernet-phy-id0007.c0c0 # LAN8700
      - ethernet-phy-id0007.c0c3 # LAN8700
      - ethernet-phy-id0007.c0d0 # LAN911x Internal PHY
      - ethernet-phy-id0007.c0f0 # LAN8710/LAN8720
      - ethernet-phy-id0007.c0f1 # LAN8710/LAN8720
      - ethernet-phy-id0007.c110 # LAN8740
      - ethernet-phy-id0007.c130 # LAN8742
      - ethernet-phy-id0007.c131 # LAN8742

  clocks:
    maxItems: 1

  clock-names:
    oneOf:
      - description: 25MHz crystal input
        items:
          - const: xtal
      - description: 25MHz single-ended crystal oscillator or another 25MHz clock
        items:
          - const: clkin
      - description: 50MHz RMII reference clock
        items:
          - const: ref_clk
      default: ref_clk

  '#clock-cells':
    const: 0
    description: |
      In RMII mode the PHY outputs a 50MHz RMII reference clock (REFCLKO)
      when either an external 25MHz crystal or an external 25MHz clock
      signal is used as input of the PHY.
      The pad is shared with the nINT functionality, meaning the PHY cannot
      output the interrupt signal when it generates the REFCLKO.

  smsc,disable-energy-detect:
    type: boolean
    description: |
      If set, do not enable energy detect mode for the SMSC PHY.
      default: enable energy detect mode

allOf:
  - $ref: ethernet-phy.yaml#
  - if:
      properties:
        compatible:
          contains:
            enum:
              - ethernet-phy-id0007.c0d0
      then:
        clock-names:
          const: xtal
          default: xtal
  - if:
      properties:
        clock-names:
          contains:
            const: ref_clk
      then:
        '#clock-cells': false
  - if:
      required:
        - interrupts
      then:
        '#clock-cells': false
  - if:
      not:
        properties:
          compatible:
            contains:
              enum:
                - ethernet-phy-id0007.c0f1
                - ethernet-phy-id0007.c130
                - ethernet-phy-id0007.c131
      then:
        '#clock-cells': false

unevaluatedProperties: false

examples:
  - |
    mdio {
        #address-cells = <1>;
        #size-cells = <0>;

        ethernet-phy@1 {
            reg = <1>;
            clock = <&phy_clk_in>;
        };

        ethernet-phy@2 {
            reg = <2>;
            smsc,disable-energy-detect;
        };
    };
